<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>비밀번호 재설정 - 하이탑 AI 부동산 업무센터</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:#071625; color:#f5f8fb; font-family:Pretendard,'Malgun Gothic',sans-serif; }
    main { width:100%; max-width:360px; }
    header { text-align:center; margin-bottom:28px; }
    .logo { width:56px; height:56px; display:grid; place-items:center; margin:0 auto 14px; border-radius:14px; background:linear-gradient(135deg,#d8b84a,#f0c040); font-size:1.6rem; }
    h1 { font-size:1.4rem; color:#d8b84a; }
    p { color:#a9b8c9; font-size:0.9rem; line-height:1.6; }
    label { display:block; margin-bottom:8px; font-size:0.9rem; }
    input[type=password], input[type=text] { width:100%; padding:14px 16px; margin-bottom:16px; border:1px solid #294057; border-radius:10px; background:#101f32; color:#f5f8fb; font-size:1rem; }
    .toggle { display:flex; align-items:center; gap:8px; margin-bottom:20px; color:#a9b8c9; }
    button, .back { display:block; width:100%; padding:14px; border-radius:10px; font-size:1rem; font-weight:700; text-align:center; cursor:pointer; }
    button { border:0; background:#d8b84a; color:#071423; }
    button:disabled { opacity:0.5; cursor:wait; }
    .back { margin-top:16px; border:1px solid #d8b84a; color:#d8b84a; text-decoration:none; }
    :focus-visible { outline:2px solid #f0c040; outline-offset:3px; }
    #message { min-height:44px; color:#d8b84a; }
    #message.error { color:#ff8585; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="logo" aria-hidden="true">🏢</div>
      <h1>비밀번호 재설정</h1>
      <p>하이탑 AI 부동산 업무센터<br />새 비밀번호를 8자 이상 입력하세요.</p>
    </header>
    <p id="message" role="status" aria-live="polite">재설정 링크를 확인하고 있습니다.</p>
    <form id="resetForm" hidden novalidate>
      <label for="newPassword">새 비밀번호</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required />
      <label for="confirmPassword">새 비밀번호 확인</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required />
      <label class="toggle"><input id="showPassword" type="checkbox" />비밀번호 표시</label>
      <button id="saveBtn" type="submit" disabled>비밀번호 변경</button>
    </form>
    <button id="logoutBtn" type="button" hidden>로그아웃 다시 시도</button>
    <a class="back" href="login.html">로그인 화면으로 돌아가기</a>
  </main>
  <script>
    (function () {
      const SUPABASE_URL = "https://xaxbkdnrzsghsabkdvzj.supabase.co";
      const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhheGJrZG5yenNnaHNhYmtkdnpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwNjc5NTIsImV4cCI6MjA4OTY0Mzk1Mn0.l27ZYQHLt48p7EQrZ8gbAOmJHvCfIur84CtgoWlA8Wg";
      const message = document.getElementById("message");
      const form = document.getElementById("resetForm");
      const passwordEl = document.getElementById("newPassword");
      const confirmEl = document.getElementById("confirmPassword");
      const saveBtn = document.getElementById("saveBtn");
      const logoutBtn = document.getElementById("logoutBtn");
      let recoveryUserId = null;
      let busy = false;
      let completed = false;

      function showMessage(text, error) {
        message.textContent = text;
        message.className = error ? "error" : "";
      }
      function invalidLink() {
        recoveryUserId = null;
        form.hidden = true;
        saveBtn.disabled = true;
        showMessage("재설정 링크가 만료되었거나 유효하지 않습니다. 로그인 화면에서 재설정 메일을 다시 요청하세요.", true);
      }
      // 오류 링크로 들어왔을 때 기존 로그인 세션을 복구 세션으로 오인하지 않는다.
      const hash = new URLSearchParams(location.hash.slice(1));
      const query = new URLSearchParams(location.search);
      if (hash.has("error") || hash.has("error_code") || query.has("error") || query.has("error_code")) {
        history.replaceState(null, "", location.pathname);
        invalidLink();
        return;
      }
      if (!window.supabase) {
        showMessage("인증 서비스를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 페이지를 새로고침하세요.", true);
        return;
      }
      const authClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      async function validRecoverySession() {
        if (!recoveryUserId) return false;
        const { data, error } = await authClient.auth.getUser();
        return !error && data.user && data.user.id === recoveryUserId;
      }
      async function enableRecoveryForm() {
        try {
          if (completed) return;
          if (!await validRecoverySession()) { invalidLink(); return; }
          form.hidden = false;
          saveBtn.disabled = false;
          showMessage("새 비밀번호와 확인 비밀번호를 입력하세요.");
          passwordEl.focus();
        } catch (error) { invalidLink(); }
      }
      // Auth 콜백 안에서는 다른 Auth 호출을 기다리지 않는다 (잠금 교착 방지).
      authClient.auth.onAuthStateChange(function (event, session) {
        if (event === "PASSWORD_RECOVERY" && session && session.user && !completed) {
          recoveryUserId = session.user.id;
          history.replaceState(null, "", location.pathname);
          setTimeout(enableRecoveryForm, 0);
        } else if (event === "SIGNED_OUT") {
          recoveryUserId = null;
          if (!completed) invalidLink();
        }
      });
      // 초기 URL 처리 완료를 기다리되 일반 로그인 세션만으로는 폼을 열지 않는다.
      authClient.auth.getSession().then(function (res) {
        if (res.error || !res.data.session || !recoveryUserId) invalidLink();
      }).catch(invalidLink);

      document.getElementById("showPassword").addEventListener("change", function (event) {
        passwordEl.type = confirmEl.type = event.target.checked ? "text" : "password";
      });
      async function finishLogout() {
        logoutBtn.disabled = true;
        try {
          const { error } = await authClient.auth.signOut({ scope: "local" });
          if (error) throw error;
          logoutBtn.hidden = true;
          showMessage("비밀번호가 변경되었으며 로그아웃되었습니다. 로그인 화면에서 새 비밀번호로 로그인하세요.");
        } catch (error) {
          logoutBtn.hidden = false;
          showMessage("비밀번호는 변경되었지만 로그아웃하지 못했습니다. 아래 버튼으로 로그아웃을 다시 시도하세요.", true);
        } finally { logoutBtn.disabled = false; }
      }
      logoutBtn.addEventListener("click", finishLogout);
      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (busy || completed) return;
        const password = passwordEl.value;
        if (password.length < 8) {
          showMessage("비밀번호는 8자 이상 입력하세요.", true);
          passwordEl.focus();
          return;
        }
        if (password !== confirmEl.value) {
          showMessage("두 비밀번호가 일치하지 않습니다.", true);
          confirmEl.focus();
          return;
        }
        busy = true;
        saveBtn.disabled = true;
        saveBtn.textContent = "변경 중...";
        try {
          if (!await validRecoverySession()) { invalidLink(); return; }
          const { error } = await authClient.auth.updateUser({ password });
          if (error) {
            if (error.status === 401 || error.status === 403) { invalidLink(); return; }
            showMessage("비밀번호를 변경하지 못했습니다. 기존과 다른 비밀번호를 사용하고 잠시 후 다시 시도하세요.", true);
            return;
          }
          completed = true;
          recoveryUserId = null;
          passwordEl.value = confirmEl.value = "";
          form.hidden = true;
          await finishLogout();
        } catch (error) {
          showMessage("연결을 확인한 뒤 다시 시도하세요. 링크가 만료되었다면 로그인 화면에서 재설정 메일을 다시 요청하세요.", true);
        } finally {
          busy = false;
          saveBtn.disabled = completed || !recoveryUserId;
          saveBtn.textContent = "비밀번호 변경";
        }
      });
    })();
  </script>
</body>
</html>
