<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>관리자 로그인 - 하이탑 AI 부동산 업무센터</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body style="margin:0;background:#071625;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:Pretendard,'Malgun Gothic',sans-serif;">
  <div style="width:100%;max-width:320px;">
    <div style="text-align:center;margin-bottom:36px;">
      <div style="width:56px;height:56px;background:linear-gradient(135deg,#d8b84a,#f0c040);border-radius:14px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;">🏢</div>
      <div style="font-size:1.4rem;font-weight:800;color:#d8b84a;letter-spacing:0.5px;">HITOP 부동산</div>
      <div style="font-size:0.8rem;color:#8193a8;margin-top:4px;">AI 부동산 업무센터 관리자 로그인</div>
    </div>

    <input id="loginEmail" type="email" placeholder="이메일" autocomplete="username"
      style="width:100%;box-sizing:border-box;padding:14px 16px;font-size:1rem;background:#101f32;border:1px solid #294057;border-radius:10px;color:#f5f8fb;outline:none;margin-bottom:10px;" />
    <input id="loginPassword" type="password" placeholder="비밀번호" autocomplete="current-password"
      style="width:100%;box-sizing:border-box;padding:14px 16px;font-size:1rem;background:#101f32;border:1px solid #294057;border-radius:10px;color:#f5f8fb;outline:none;margin-bottom:10px;" />
    <div id="loginError" style="font-size:0.82rem;color:#ff8585;text-align:center;min-height:20px;margin-bottom:10px;"></div>
    <button id="loginBtn" style="width:100%;padding:14px;background:#d8b84a;color:#071423;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;">로그인</button>
    <button id="resetBtn" type="button" style="width:100%;margin-top:12px;padding:12px;background:transparent;color:#d8b84a;border:1px solid #d8b84a;border-radius:10px;font-size:0.95rem;cursor:pointer;">비밀번호 재설정</button>
    <p id="resetMessage" role="status" aria-live="polite" style="font-size:0.85rem;color:#d8b84a;line-height:1.6;text-align:center;"></p>
  </div>

  <script>
    (function () {
      const SUPABASE_URL = "https://xaxbkdnrzsghsabkdvzj.supabase.co";
      const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhheGJrZG5yenNnaHNhYmtkdnpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwNjc5NTIsImV4cCI6MjA4OTY0Mzk1Mn0.l27ZYQHLt48p7EQrZ8gbAOmJHvCfIur84CtgoWlA8Wg";
      const authClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const emailEl = document.getElementById("loginEmail");
      const pwEl = document.getElementById("loginPassword");
      const errEl = document.getElementById("loginError");
      const btnEl = document.getElementById("loginBtn");
      const resetBtn = document.getElementById("resetBtn");
      const resetMessage = document.getElementById("resetMessage");
      const RESET_REDIRECT_URL = "https://hitoputube-creator.github.io/hitop-ai-workcenter/reset-password.html";

      resetBtn.addEventListener("click", async function () {
        if (resetBtn.disabled) return;
        resetMessage.textContent = "";
        const email = emailEl.value.trim();
        if (!email) {
          resetMessage.textContent = "로그인 이메일을 먼저 입력하세요.";
          emailEl.focus();
          return;
        }
        if (!emailEl.checkValidity()) {
          resetMessage.textContent = "올바른 이메일 주소를 입력하세요.";
          emailEl.focus();
          return;
        }
        resetBtn.disabled = true;
        resetBtn.textContent = "메일 발송 중...";
        try {
          const { error } = await authClient.auth.resetPasswordForEmail(email, {
            redirectTo: RESET_REDIRECT_URL
          });
          // 계정 존재 여부를 유추할 수 있는 서버 오류 원문은 노출하지 않는다.
          if (error) throw error;
          resetMessage.textContent = "입력한 이메일로 재설정 링크를 보냈습니다. 메일함과 스팸함을 확인하세요.";
        } catch (error) {
          resetMessage.textContent = "재설정 메일을 요청하지 못했습니다. 잠시 후 다시 시도하세요.";
        } finally {
          resetBtn.disabled = false;
          resetBtn.textContent = "비밀번호 재설정";
        }
      });

      // redirect 파라미터는 같은 사이트 안의 파일명(+쿼리)만 허용한다 (오픈 리다이렉트 방지).
      function getRedirectTarget() {
        const params = new URLSearchParams(location.search);
        const raw = params.get("redirect") || "";
        if (!raw || raw.indexOf("login.html") === 0 || /^https?:\/\//i.test(raw) || raw.indexOf("//") === 0) {
          return "index.html";
        }
        return raw;
      }

      async function tryLogin() {
        errEl.textContent = "";
        const email = emailEl.value.trim();
        const password = pwEl.value;
        if (!email || !password) {
          errEl.textContent = "이메일과 비밀번호를 입력하세요.";
          return;
        }
        btnEl.disabled = true;
        btnEl.textContent = "로그인 중...";
        const { error } = await authClient.auth.signInWithPassword({ email, password });
        btnEl.disabled = false;
        btnEl.textContent = "로그인";
        if (error) {
          errEl.textContent = "로그인 실패: 이메일 또는 비밀번호를 확인하세요.";
          pwEl.value = "";
          pwEl.focus();
          return;
        }
        location.replace(getRedirectTarget());
      }

      btnEl.addEventListener("click", tryLogin);
      [emailEl, pwEl].forEach(function (el) {
        el.addEventListener("keydown", function (e) {
          if (e.key === "Enter") tryLogin();
        });
      });

      // 이미 유효한 세션이 있으면 로그인 화면을 보여주지 않고 바로 이동한다.
      authClient.auth.getSession().then(function (res) {
        if (res.data.session) location.replace(getRedirectTarget());
      });

      emailEl.focus();
    })();
  </script>
</body>
</html>
