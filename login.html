<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>관리자 로그인 - 하이탑 AI 부동산 업무센터</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root{--navy-deep:#081840;--navy:#0A1F5C;--bg:#EEF1F7;--surface:#FFFFFF;--line:#E1E5EF;--line-strong:#C7CEDE;--ink:#162041;--mist:#5E6684;--danger:#B6392F}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;font-family:Pretendard,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;color:var(--ink);color-scheme:light}
    :focus-visible{outline:2px solid var(--navy);outline-offset:2px}
    .card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:36px 32px;box-shadow:0 1px 2px rgba(10,22,60,.05),0 12px 28px rgba(10,22,60,.07)}
    .brand{text-align:center;margin-bottom:28px}
    .logo{width:52px;height:52px;background:var(--navy);color:#fff;border-radius:12px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:900}
    .brand h1{font-size:1.25rem;font-weight:800;color:var(--navy-deep);letter-spacing:-.01em;margin:0}
    .brand p{font-size:.8rem;color:var(--mist);margin:5px 0 0}
    input{width:100%;padding:13px 14px;font-size:1rem;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;color:var(--ink);outline:none;margin-bottom:10px;font-family:inherit}
    input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(10,31,92,.1)}
    input::placeholder{color:#9199B2}
    #loginError{font-size:.82rem;color:var(--danger);text-align:center;min-height:20px;margin-bottom:6px}
    .btn{display:block;box-sizing:border-box;width:100%;padding:13px;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;font-family:inherit}
    .btn-primary{background:var(--navy);color:#fff;border:none;margin-top:4px}
    .btn-primary:hover{background:var(--navy-deep)}
    .btn-ghost{margin-top:10px;background:transparent;color:var(--navy);border:1px solid var(--line-strong)}
    .btn-ghost:hover{background:#F6F7FB;border-color:var(--navy)}
    #resetMessage{font-size:.85rem;color:var(--mist);line-height:1.6;text-align:center;margin:14px 0 0}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo" aria-hidden="true">HT</div>
      <h1>HITOP 부동산</h1>
      <p>AI 부동산 업무센터 관리자 로그인</p>
    </div>

    <input id="loginEmail" type="email" placeholder="이메일" autocomplete="username" />
    <input id="loginPassword" type="password" placeholder="비밀번호" autocomplete="current-password" />
    <div id="loginError"></div>
    <button id="loginBtn" class="btn btn-primary">로그인</button>
    <button id="resetBtn" type="button" class="btn btn-ghost">비밀번호 재설정</button>
    <a id="commonHomeLink" href="https://hitoputube-creator.github.io/haitop-realty-system/login.html" class="btn btn-ghost">공통 홈으로</a>
    <p id="resetMessage" role="status" aria-live="polite"></p>
  </div>

  <script>
    (function () {
      const SUPABASE_URL = "https://xaxbkdnrzsghsabkdvzj.supabase.co";
      const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhheGJrZG5yenNnaHNhYmtkdnpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwNjc5NTIsImV4cCI6MjA4OTY0Mzk1Mn0.l27ZYQHLt48p7EQrZ8gbAOmJHvCfIur84CtgoWlA8Wg";
      const authClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const emailEl = document.getElementById("loginEmail");
      const pwEl = document.getElementById("loginPassword");
      const errEl = document.getElementById("loginError");
      const btnEl = document.getElementById("loginBtn");
      const resetBtn = document.getElementById("resetBtn");
      const resetMessage = document.getElementById("resetMessage");
      const RESET_REDIRECT_URL = "https://hitoputube-creator.github.io/hitop-ai-workcenter/reset-password.html";

      resetBtn.addEventListener("click", async function () {
        if (resetBtn.disabled) return;
        resetMessage.textContent = "";
        const email = emailEl.value.trim();
        if (!email) {
          resetMessage.textContent = "로그인 이메일을 먼저 입력하세요.";
          emailEl.focus();
          return;
        }
        if (!emailEl.checkValidity()) {
          resetMessage.textContent = "올바른 이메일 주소를 입력하세요.";
          emailEl.focus();
          return;
        }
        resetBtn.disabled = true;
        resetBtn.textContent = "메일 발송 중...";
        try {
          const { error } = await authClient.auth.resetPasswordForEmail(email, {
            redirectTo: RESET_REDIRECT_URL
          });
          // 계정 존재 여부를 유추할 수 있는 서버 오류 원문은 노출하지 않는다.
          if (error) throw error;
          resetMessage.textContent = "입력한 이메일로 재설정 링크를 보냈습니다. 메일함과 스팸함을 확인하세요.";
        } catch (error) {
          resetMessage.textContent = "재설정 메일을 요청하지 못했습니다. 잠시 후 다시 시도하세요.";
        } finally {
          resetBtn.disabled = false;
          resetBtn.textContent = "비밀번호 재설정";
        }
      });

      // redirect 파라미터는 같은 사이트 안의 파일명(+쿼리)만 허용한다 (오픈 리다이렉트 방지).
      function getRedirectTarget() {
        const params = new URLSearchParams(location.search);
        const raw = params.get("redirect") || "";
        if (!raw || raw.indexOf("login.html") === 0 || /^https?:\/\//i.test(raw) || raw.indexOf("//") === 0) {
          return "index.html";
        }
        return raw;
      }

      async function tryLogin() {
        errEl.textContent = "";
        const email = emailEl.value.trim();
        const password = pwEl.value;
        if (!email || !password) {
          errEl.textContent = "이메일과 비밀번호를 입력하세요.";
          return;
        }
        btnEl.disabled = true;
        btnEl.textContent = "로그인 중...";
        const { error } = await authClient.auth.signInWithPassword({ email, password });
        btnEl.disabled = false;
        btnEl.textContent = "로그인";
        if (error) {
          errEl.textContent = "로그인 실패: 이메일 또는 비밀번호를 확인하세요.";
          pwEl.value = "";
          pwEl.focus();
          return;
        }
        location.replace(getRedirectTarget());
      }

      btnEl.addEventListener("click", tryLogin);
      [emailEl, pwEl].forEach(function (el) {
        el.addEventListener("keydown", function (e) {
          if (e.key === "Enter") tryLogin();
        });
      });

      // 이미 유효한 세션이 있으면 로그인 화면을 보여주지 않고 바로 이동한다.
      authClient.auth.getSession().then(function (res) {
        if (res.data.session) location.replace(getRedirectTarget());
      });

      emailEl.focus();
    })();
  </script>
</body>
</html>
