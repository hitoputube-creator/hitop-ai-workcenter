  threads: `스레드(Threads)용 짧은 글. 300~400자, 캐주얼하고 솔직한 톤, 첫 문장이 후킹. 해시태그 3~5개로 마무리.`,
  youtube: `유튜브 쇼츠 대본 (50~60초). "[제목 후보 3개]" 다음 "[TTS 대본]" 형식으로. 마지막에 하이탑부동산 소개 한 줄.`,

  resultError: "",

function sbFetch(path, method, body, extra) {
  const h = { apikey: SB_KEY, Authorization: "Bearer " + (_authToken || SB_KEY), "Content-Type": "application/json" };
  if (extra) Object.assign(h, extra);
  const opt = { method: method || "GET", headers: h };
  if (body != null) opt.body = JSON.stringify(body);
  return fetch(SB_URL + path, opt).then((r) => {
    if (!r.ok) return r.text().then((t) => { throw new Error(t || r.statusText); });
    if (r.status === 204) return null;
    return r.json();
  });
}

async function callClaude(prompt, useSearch) {
  const res = await fetch(SB_URL + "/functions/v1/content-studio-generate", {
    method: "POST",
    headers: { apikey: SB_KEY, Authorization: "Bearer " + (_authToken || SB_KEY), "Content-Type": "application/json" },
    body: JSON.stringify({ prompt, useSearch: !!useSearch }),
  });
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || "API 오류");
  return (data.text || "").trim();
}

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function copyText(text, btn) {
  const done = () => { if (btn) { const o = btn.textContent; btn.textContent = "복사됨"; setTimeout(() => { btn.textContent = o; }, 1200); } };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => { window.prompt("아래 글을 복사하세요 (Ctrl+C)", text); });
  } else {
    window.prompt("아래 글을 복사하세요 (Ctrl+C)", text);
  }
}

function extractTitle(text) {
  const m = text.match(/제목\s*[:：]\s*(.+)/);
  if (m) return m[1].trim().slice(0, 40);
  return text.replace(/\s+/g, " ").slice(0, 30);
}

    state.cardsError = "칸반보드를 불러오지 못했어요: " + e.message;

      hint.className = "label-sm";
      hint.textContent = "다룰 소식을 하나 골라 주세요";
      area.appendChild(hint);
    }
    if (state.newsCandidates.length > 0 && !state.newsDetail) {

        const b = document.createElement("button");
        b.type = "button";

function currentMaterial() {
  if (state.materialMode === "news") return state.newsMaterial;
  if (state.materialMode === "listing") return state.listingText;
  return state.externalText;
}

function parseJsonArray(text) {
  const m = text.match(/\[[\s\S]*\]/);
  if (!m) return null;
  try { const a = JSON.parse(m[0]); return Array.isArray(a) ? a : null; } catch (e) { return null; }
}

function selectNewsCategory(key) {
  if (state.newsLoading || state.newsDetailLoading) return;
  if (state.newsCandidates.length) state.newsByCategory[state.newsCategory] = state.newsCandidates;
  state.newsCategory = key;
  state.newsCandidates = state.newsByCategory[key] || [];
  state.newsPick = -1; state.newsDetail = null; state.newsMaterial = ""; state.newsError = "";
  render();
}

async function fetchNews() {
  const cat = NEWS_CATEGORIES.find(c => c.key === state.newsCategory) || NEWS_CATEGORIES[0];
  const labels = NEWS_CATEGORIES.filter(c => c.key !== "mix").map(c => c.label);
  state.newsLoading = true; state.newsMaterial = ""; state.newsError = ""; state.newsCandidates = []; state.newsPick = -1; state.newsDetail = null; render();
  try {
    const today = new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Seoul" });
    const scope = cat.key === "mix"
      ? "아래 여섯 종류에서 골고루(종류마다 1~2개) 서로 다른 항목 8개를 고르세요.\n" + NEWS_CATEGORIES.filter(c => c.key !== "mix").map(c => "- " + c.label + ": " + c.ask).join("\n")
      : "종류: " + cat.label + "\n" + cat.ask + "\n이 종류에 맞는 서로 다른 항목 8개를 고르세요.";
    const kindRule = cat.key === "mix" ? labels.join(", ") + " 중 하나" : cat.label;
    const text = await callClaude(`오늘은 ${today}입니다. 하이탑부동산(파주 운정)의 블로그·SNS 글감으로 쓸 한국 부동산 관련 소식을 웹검색으로 찾아 주세요.
${scope}
실제로 보도되거나 공식 발표된 내용만 쓰고 지어내지 마세요. 같은 내용을 두 번 넣지 마세요.
아래 JSON 배열만 출력하세요. 다른 설명이나 마크다운 기호는 쓰지 마세요.
[{"kind":"${kindRule}","title":"제목 요약(30자 내외)","source":"매체명 또는 발표 기관","date":"YYYY-MM-DD"}]`, true);
    const arr = parseJsonArray(text);
    if (!arr || arr.length === 0) throw new Error("소식 목록을 읽지 못했어요. 다시 눌러 주세요.");
    const toKind = (k) => {
      if (cat.key !== "mix") return cat.label;
      const s = String(k || "").replace(/\s+/g, "");
      const hit = NEWS_CATEGORIES.find(c => c.key !== "mix" && s.includes(c.label.replace(/\s+/g, "")));
      return hit ? hit.label : "부동산소식";
    };
    const order = labels;
    state.newsCandidates = arr.slice(0, 8).map(n => ({ kind: toKind(n.kind), title: String(n.title || "").trim(), source: String(n.source || "").trim(), date: String(n.date || "").trim() })).filter(n => n.title)
      .sort((a, b) => order.indexOf(a.kind) - order.indexOf(b.kind));
    if (state.newsCandidates.length === 0) throw new Error("소식 목록이 비어 있어요. 다시 눌러 주세요.");
    state.newsByCategory[cat.key] = state.newsCandidates;
  } catch (e) {
    state.newsError = cat.label + "을(를) 가져오지 못했어요: " + e.message;
  }
  state.newsLoading = false; render();
}

async function pickNews(i) {
  const n = state.newsCandidates[i];
  if (!n || state.newsDetailLoading) return;
  state.newsPick = i; state.newsDetailLoading = true; state.newsError = ""; render();
  try {
    const text = await callClaude(`아래 기사에 대해 웹검색으로 내용을 확인하고 정리해 주세요.
소식 종류: ${n.kind || "부동산소식"}
기사 제목: ${n.title}
매체: ${n.source}
날짜: ${n.date}
아래 형식을 정확히 지키세요. 마크다운 기호는 쓰지 마세요. 확인되지 않은 내용은 쓰지 마세요.
제목: (기사 제목 요약, 30자 내외)
요약: (핵심 내용 3~4문장${/세법|법령|꼭 알아야/.test(n.kind || "") ? ". 시행일·적용 대상·달라지는 점을 꼭 넣으세요" : ""})
출처: (매체명, 보도 날짜, 기사 주소가 있으면 주소까지)`, true);
    const t = (text.match(/제목\s*[:：]\s*(.+)/) || [])[1];
    const s = (text.match(/요약\s*[:：]\s*([\s\S]*?)(?:\n\s*출처\s*[:：]|$)/) || [])[1];
    const o = (text.match(/출처\s*[:：]\s*([\s\S]+)$/) || [])[1];
    if (!s) throw new Error("요약을 읽지 못했어요. 다시 눌러 주세요.");
    state.newsDetail = { title: (t || n.title).trim(), summary: s.trim(), source: (o || [n.source, n.date].filter(Boolean).join(", ")).trim() };
    state.newsMaterial = "제목: " + state.newsDetail.title + "\n요약: " + state.newsDetail.summary + "\n출처: " + state.newsDetail.source;
  } catch (e) {
    state.newsError = "요약하지 못했어요: " + e.message;
    state.newsPick = -1;
  }
  state.newsDetailLoading = false; render();
}

async function runGenerate() {
  const material = currentMaterial();
  if (!material.trim() || state.genLoading) return;
  state.genLoading = true; state.resultText = ""; state.resultError = ""; render();
  const modeNote = state.materialMode === "news"
    ? "아래는 실제 뉴스 자료입니다. 그대로 베끼지 말고, 하이탑부동산 시각에서 손님에게 도움이 되는 내용으로 재구성·재작성하세요."
    : state.materialMode === "listing"
    ? "아래는 매물 정보입니다. 이 매물을 홍보하는 글로 작성하세요."
    : "아래는 참고 자료입니다. 핵심만 뽑아 하이탑부동산 톤으로 재편집하세요.";
  const prompt = `${REWRITE_STYLE[state.selectedChannel]}

${modeNote}

[자료]
${material}

${state.reinforce ? "가능하면 관련 법령이나 공식 통계를 근거로 덧붙여 신뢰도를 높이세요. 확실하지 않은 수치는 지어내지 마세요." : ""}
${state.selectedChannel === "blog" ? "위 틀(제목, 본문, 현장 경험 자리, 출처, 면책 문구, 연락처, 태그, 이미지 설명)을 하나도 빼지 말고 그대로 출력하세요. 마크다운 기호는 쓰지 마세요." : "본문만 출력하세요 (제목 별도 표시 없이)."}`;
  try {
    state.resultText = await callClaude(prompt, state.reinforce);
  } catch (e) {
    state.resultError = e.message;
  }
  state.genLoading = false; render();
}

async function saveToBoard() {
  const material = currentMaterial();
  const title = extractTitle(state.selectedChannel === "blog" && /제목\s*[:：]/.test(state.resultText) ? state.resultText : material);
  const modeLabel = MATERIAL_MODES.find(m => m.key === state.materialMode).label;
  const newCard = {
    title: title || "제목 없음",
    category: modeLabel,
    channel: CHANNELS.find(c => c.key === state.selectedChannel).label,
    draft: state.resultText,
    status: "기획중",
  };
  try {
    const rows = await sbFetch("/rest/v1/content_items", "POST", newCard, { Prefer: "return=representation" });
    state.cards = [rows[0], ...state.cards];
    state.resultText = "";
  } catch (e) {
    state.cardsError = "저장하지 못했어요: " + e.message;
  }
  render();
}

async function moveCard(id, dir) {
  const card = state.cards.find(c => c.id === id);
  if (!card) return;
  const idx = COLUMNS.indexOf(card.status);
  const next = Math.min(Math.max(idx + dir, 0), COLUMNS.length - 1);
  const nextStatus = COLUMNS[next];
  if (nextStatus === card.status) return;
  try {
    await sbFetch(`/rest/v1/content_items?id=eq.${id}`, "PATCH", { status: nextStatus });
    state.cards = state.cards.map(c => c.id === id ? { ...c, status: nextStatus } : c);
    render();
  } catch (e) {
    state.cardsError = "이동하지 못했어요: " + e.message;
    render();
  }
}

async function deleteCard(id) {
  try {
    await sbFetch(`/rest/v1/content_items?id=eq.${id}`, "DELETE");
    state.cards = state.cards.filter(c => c.id !== id);
    render();
  } catch (e) {
    state.cardsError = "삭제하지 못했어요: " + e.message;
    render();
  }
}

function renderKanban() {
  const el = document.getElementById("kanbanArea");
  el.innerHTML = "";
  if (state.cardsLoading) {
    el.innerHTML = '<p class="muted">불러오는 중...</p>';
    return;
  }
  if (state.cardsError) {
    el.innerHTML = `<p class="error-text">${esc(state.cardsError)}</p>`;
  }
  if (state.cards.length === 0) {
    el.innerHTML += '<p class="muted">아직 저장된 콘텐츠가 없어요. 콘텐츠 스튜디오에서 먼저 만들어보세요.</p>';
    return;
  }
  const grid = document.createElement("div");
  grid.className = "kanban-grid";
  COLUMNS.forEach((col, colIdx) => {
    const colEl = document.createElement("div");
    const count = state.cards.filter(c => c.status === col).length;
    colEl.innerHTML = `<p class="col-title">${col} (${count})</p>`;
    state.cards.filter(c => c.status === col).forEach(c => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <span class="badge">${esc(c.category)}</span>
        <p class="title" style="cursor:pointer;" data-open="${esc(c.id)}">${esc(c.title)}</p>
        <p class="chan">${esc(c.channel)}</p>
        <div class="row">
          <div>
            <button class="move-btn" ${colIdx === 0 ? "disabled" : ""} data-move="-1" data-id="${c.id}">◀</button>
            <button class="move-btn" ${colIdx === COLUMNS.length - 1 ? "disabled" : ""} data-move="1" data-id="${c.id}">▶</button>
          </div>
          <button class="del-btn" data-del="${c.id}">삭제</button>
        </div>`;
      colEl.appendChild(card);
    });
    grid.appendChild(colEl);
  });
  el.appendChild(grid);

  el.querySelectorAll("[data-move]").forEach(b => {
    b.onclick = () => moveCard(b.getAttribute("data-id"), parseInt(b.getAttribute("data-move")));
  });
  el.querySelectorAll("[data-del]").forEach(b => {
    b.onclick = () => { if (confirm("이 카드를 삭제할까요? 삭제하면 되돌릴 수 없어요.")) deleteCard(b.getAttribute("data-del")); };
  });
  el.querySelectorAll("[data-open]").forEach(b => {
    b.onclick = () => { const id = b.getAttribute("data-open"); state.openCardId = state.openCardId === id ? null : id; render(); };
  });
  const open = state.cards.find(c => String(c.id) === String(state.openCardId));
  if (open) {
    const box = document.createElement("div");
    box.className = "result-panel";
    box.style.marginTop = "16px";
    box.innerHTML = '<p style="color:' + GOLD + ';font-size:12px;font-weight:600;margin:0 0 6px;">' + esc(open.title) + " · " + esc(open.channel) + '</p><div class="result-box">' + esc(open.draft || "(저장된 초안이 없어요)") + "</div>";
    const cp = document.createElement("button");
    cp.className = "ghost-btn";
    cp.textContent = "초안 복사";
    cp.onclick = () => copyText(open.draft || "", cp);
    box.appendChild(cp);
    el.appendChild(box);
  }
}

document.getElementById("tabStudioBtn").onclick = () => { state.tab = "studio"; render(); };
document.getElementById("tabKanbanBtn").onclick = () => { state.tab = "kanban"; render(); };
document.getElementById("genBtn").onclick = runGenerate;
document.getElementById("reinforceChk").onchange = (e) => { state.reinforce = e.target.checked; };
document.getElementById("logoutBtn").onclick = () => _authClient.auth.signOut();

render();
_authReady.then(loadCards);
</script>
</body>
</html>
